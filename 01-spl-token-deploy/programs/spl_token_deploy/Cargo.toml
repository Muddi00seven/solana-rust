[package]
name = "spl_token_deploy"
version = "0.1.0"
description = "Lecture 1 - create and mint a custom SPL token with an Anchor program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spl_token_deploy"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
