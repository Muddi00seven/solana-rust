[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
nft_mint = "AXfnZ45FUoVyzTZTNdkm6XG9QzwYjrfk7vomKEobuVXF"

[programs.devnet]
nft_mint = "AXfnZ45FUoVyzTZTNdkm6XG9QzwYjrfk7vomKEobuVXF"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = ".wallet/deployer.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# `anchor test` spins up a fresh local validator that only has the System/
# Token/etc programs by default - the Metaplex Token Metadata program isn't
# on it unless we clone it in from a real cluster first. Without this block,
# tests/nft_mint.ts's CPI into Token Metadata fails with "program not found".
[test.validator]
url = "https://api.mainnet-beta.solana.com"

[[test.validator.clone]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
